# Production-style stack: Postgres, the app (API + built frontend), and the sandbox image.
# Run from the repo root on a Linux host with Docker: `docker compose up -d --build`.
# Verified in CI; Docker Hub images can't be pulled locally in our region (docs/decisions.md).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      retries: 30

  # Builds datasage-sandbox:latest for the app to start; the container itself just exits.
  sandbox-image:
    build: ./sandbox-image
    image: datasage-sandbox:latest
    entrypoint: ["python", "-c", "pass"]
    restart: "no"

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Same path inside and outside: the host's Docker resolves the sandbox bind mounts.
      DATA_DIR: ${PWD}/data
      SANDBOX_DOCKER: docker
      SANDBOX_WSL_PATHS: "false"
    volumes:
      - ${PWD}/data:${PWD}/data
      - /var/run/docker.sock:/var/run/docker.sock  # only the app gets it, never a sandbox
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      sandbox-image:
        condition: service_completed_successfully

volumes:
  pgdata:
