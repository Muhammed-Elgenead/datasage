[project]
name = "datasage-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "DataSage backend: FastAPI, uploads, profiling, agent"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.9.0",
    "asyncpg>=0.32.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.163.1",
    "google-genai>=3.4.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--basetemp=../.tmp/pytest"  # keep tmp_path on E:
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
