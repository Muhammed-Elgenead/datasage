name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.12"
  PYTHONUNBUFFERED: "1"

jobs:
  backend:
    name: Backend (ruff, pytest incl. real sandbox containers)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: datasage
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: datasage_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U datasage" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://datasage:ci-password@localhost:5432/datasage_test
      TEST_DATABASE_URL: postgresql+asyncpg://datasage:ci-password@localhost:5432/datasage_test
      # The runner has Docker, so the sandbox tests run against real containers here.
      SANDBOX_DOCKER: docker
      SANDBOX_WSL_PATHS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build the sandbox image
        run: docker build -t datasage-sandbox:latest sandbox-image
      - name: Sync
        working-directory: backend
        run: uv sync --frozen
      - name: Lint (backend + evals)
        working-directory: backend
        run: |
          uv run ruff check . ../evals
          uv run ruff format --check . ../evals
      - name: Tests
        working-directory: backend
        run: uv run pytest -q -rs

  frontend:
    name: Frontend (typecheck, Vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    name: Production image + Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Configure (example env; no LLM key, so /ask answers 503, which is fine here)
        run: cp .env.example .env
      - name: Build and start
        run: docker compose up --build --detach
      - name: Wait for the app
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/api/health | jq -e '.database == "ok"' && exit 0
            sleep 2
          done
          exit 1
      - name: Smoke test (frontend, upload, profile, 503 without an LLM)
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8000/ | grep -q "<title>DataSage</title>"
          sid=$(curl -fsS -X POST http://localhost:8000/api/sessions | jq -r .id)
          curl -fsS -F "file=@evals/datasets/sales.csv" "http://localhost:8000/api/sessions/$sid/datasets" \
            | jq -e '.profile.row_count == 240'
          curl -fsS "http://localhost:8000/api/sessions/$sid" | jq -e '.datasets | length == 1'
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"question":"q"}' "http://localhost:8000/api/sessions/$sid/ask")
          test "$code" = 503
          echo "SID=$sid" >> "$GITHUB_ENV"
      - name: Sandbox from inside the app container (Docker socket + same-path data mount)
        run: |
          docker compose exec -T app python - <<'EOF'
          import uuid
          from app.core.config import get_settings
          from app.sandbox.client import run_code_sync
          r = run_code_sync(get_settings(), uuid.UUID("${{ env.SID }}"),
                            "import os, socket\n"
                            "print(sorted(os.listdir('/data')), os.getuid())\n"
                            "try:\n socket.create_connection(('1.1.1.1', 53), timeout=3); print('net')\n"
                            "except OSError: print('no-net')\n")
          print(r.status, repr(r.stdout), r.error)
          assert r.status == "ok", r
          assert "no-net" in r.stdout and "10001" in r.stdout, r.stdout
          EOF
          test -z "$(docker ps -aq --filter name=datasage-sbx-)"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down --volumes
